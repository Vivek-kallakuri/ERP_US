<div class="chat-container">
  <h2>Chat System</h2>

  <!-- Input for messages -->
  <input [(ngModel)]="newMessage" placeholder="Type a message..." />
  <button (click)="sendMessage()">Send</button>

  <!-- Direct message input -->
  <input [(ngModel)]="receiver" placeholder="Receiver (Optional for Direct Message)" />

  <!-- Group chat controls -->
  <input [(ngModel)]="groupName" placeholder="Enter group name" />
  <button (click)="joinGroup()">Join Group</button>
  <button (click)="sendGroupMessage()">Send to Group</button>

  <!-- Chat messages display -->
  <div class="messages">
    <div *ngFor="let msg of messages">
      <strong>{{ msg.sender }}</strong> to <em>{{ msg.receiver || "Group" }}</em>: {{ msg.message }}
    </div>
  </div>
</div>
