<div class="container mt-3">
    <h2>Create Employee</h2>
    <form [formGroup]="employeeForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="employeeName" class="form-label">Name</label>
        <input id="employeeName" formControlName="name" type="text" class="form-control" placeholder="Enter employee name">
      </div>
      <div class="mb-3">
        <label for="employeeEmail" class="form-label">Email</label>
        <input id="employeeEmail" formControlName="email" type="email" class="form-control" placeholder="Enter email">
      </div>
      <div class="mb-3">
        <label for="employeePhone" class="form-label">Phone</label>
        <input id="employeePhone" formControlName="phone" type="text" class="form-control" placeholder="Enter phone number">
      </div>
      <div class="mb-3">
        <label for="employeeDepartment" class="form-label">Department</label>
        <input id="employeeDepartment" formControlName="department" type="text" class="form-control" placeholder="Enter department">
      </div>
      <div class="mb-3">
        <label for="employeeRole" class="form-label">Role</label>
        <select id="employeeRole" formControlName="roleId" class="form-select">
          <option value="" disabled>Select Role</option>
          <option *ngFor="let role of roles" [value]="role.id">{{ role.name }}</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="employeeForm.invalid">Create Employee</button>
    </form>
  </div>
