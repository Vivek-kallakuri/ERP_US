<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow-lg p-4" style="width: 100%; max-width: 400px;">
      <div class="card-body">
        <h3 class="card-title text-center mb-4">Login</h3>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label for="loginEmail" class="form-label">Email address</label>
            <input id="loginEmail" type="email" formControlName="email" class="form-control" placeholder="Enter your email">
            <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="form-text text-danger">
              Please enter a valid email.
            </div>
          </div>
          <div class="mb-3">
            <label for="loginPassword" class="form-label">Password</label>
            <input id="loginPassword" type="password" formControlName="password" class="form-control" placeholder="Enter your password">
            <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="form-text text-danger">
              Password is required.
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid">Login</button>
          <div class="mt-2 text-danger" *ngIf="errorMessage">{{ errorMessage }}</div>
        </form>
      </div>
      <div class="card-footer text-center">
        <small>Don't have an account? <a routerLink="/signup">Sign up</a></small>
      </div>
    </div>
  </div>
