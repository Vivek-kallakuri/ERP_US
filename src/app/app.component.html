<!-- Only show sidebar and header when a token exists -->
<div *ngIf="authService.getToken(); else authOnly">
  <div class="d-flex">
    <!-- Sidebar -->
    <app-sidebar></app-sidebar>

    <!-- Main content area -->
    <div class="flex-grow-1" style="margin-left: 250px;">
      <!-- Header -->
      <app-header></app-header>

      <!-- Page content -->
      <div class="container mt-3">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</div>
<ng-template #authOnly>
  <!-- For auth pages, just display the router outlet -->
  <router-outlet></router-outlet>
</ng-template>
