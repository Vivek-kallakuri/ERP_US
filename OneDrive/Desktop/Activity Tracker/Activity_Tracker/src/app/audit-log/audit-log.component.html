<div class="container">
    <h2>View Audit Logs</h2>
  
    <div class="form-group">
      <label for="userId">User ID:</label>
      <input id="userId" type="number" [(ngModel)]="userId" placeholder="Enter User ID" />
    </div>
  
    <div class="form-group">
      <label for="startDate">Start Date:</label>
      <input id="startDate" type="date" [(ngModel)]="startDate" />
    </div>
  
    <div class="form-group">
      <label for="endDate">End Date:</label>
      <input id="endDate" type="date" [(ngModel)]="endDate" />
    </div>
  
    <button (click)="fetchLogs()">Fetch Logs</button>
  
    <table *ngIf="logs.length > 0">
      <thead>
        <tr>
          <th>ID</th>
          <th>User ID</th>
          <th>Action</th>
          <th>Timestamp</th>
          <th>IP Address</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let log of logs">
          <td>{{ log.id }}</td>
          <td>{{ log.userId }}</td>
          <td>{{ log.action }}</td>
          <td>{{ log.timestamp }}</td>
          <td>{{ log.ipAddress }}</td>
        </tr>
      </tbody>
    </table>
  
    <p *ngIf="logs.length === 0">No logs found for this user and date range.</p>
  </div>
